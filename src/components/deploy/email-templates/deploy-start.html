<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Deployment Started</title>
	<style>
		body {
			margin: 0;
			padding: 0;
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial,
				sans-serif;
			background-color: #f5f5f5;
		}
		.container {
			max-width: 640px;
			margin: 20px auto;
			background-color: #ffffff;
			border-radius: 10px;
			overflow: hidden;
			box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
		}
		.header {
			background: #2563eb;
			color: #ffffff;
			padding: 18px 22px;
		}
		.header .title {
			font-size: 18px;
			font-weight: 700;
			line-height: 1.2;
		}
		.header .subtitle {
			margin-top: 6px;
			font-size: 13px;
			opacity: 0.95;
		}
		.content {
			padding: 22px;
		}
		.kv {
			margin: 0;
			padding: 0;
		}
		.row {
			padding: 10px 0;
			border-bottom: 1px solid #eef2f7;
		}
		.row:last-child {
			border-bottom: none;
		}
		.label {
			display: block;
			font-size: 12px;
			color: #475569;
			font-weight: 600;
		}
		.value {
			display: block;
			margin-top: 4px;
			font-size: 14px;
			color: #0f172a;
			word-break: break-word;
		}
		.value a {
			color: #2563eb;
			text-decoration: none;
		}
		.value code {
			font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono',
				'Courier New', monospace;
			background: #f1f5f9;
			padding: 2px 6px;
			border-radius: 6px;
		}
		.actions {
			padding-top: 16px;
		}
		.btn {
			display: inline-block;
			background: #2563eb;
			color: #ffffff !important;
			text-decoration: none;
			padding: 10px 14px;
			border-radius: 8px;
			font-weight: 600;
			font-size: 13px;
		}
		.footer {
			padding: 14px 22px;
			background: #f8fafc;
			color: #64748b;
			font-size: 12px;
			text-align: center;
		}
	</style>
</head>
<body>
	<div class="container">
		<div class="header">
			<div class="title">{{environment}} - deploy started for {{repoName}}</div>
			<div class="subtitle">Triggered by {{triggerBy}} • {{startTimeIst}}</div>
		</div>
		<div class="content">
			<div class="kv">
				<div class="row">
					<span class="label">Repository</span>
					<span class="value"><a href="{{repoLink}}">{{repoName}}</a></span>
				</div>
				<div class="row">
					<span class="label">Commit</span>
					<span class="value"><a href="{{commitShaLink}}"><code>{{commitShaName}}</code></a></span>
				</div>
				<div class="row">
					<span class="label">Environment</span>
					<span class="value">{{environment}}</span>
				</div>
				<div class="row">
					<span class="label">Start time</span>
					<span class="value">{{startTimeIst}}</span>
				</div>
			</div>

			<div class="actions">
				<a class="btn" href="{{actionLink}}">Open deployment</a>
			</div>
		</div>
		<div class="footer">Deployment Notifications Bot</div>
	</div>
</body>
</html>
