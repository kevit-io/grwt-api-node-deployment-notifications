services:
  express-app:
    build: 
      context: .
    image: ${IMAGE_URI:-grwt-api-node-deployment-notifications:latest}
    container_name: ${CONTAINER_NAME:-express-app}
    restart: unless-stopped
    ports:
      # Use dynamic port from environment variable, falling back to 5000 if not set
      - '${HOST_PORT}:${HOST_PORT}'
    environment:
      - PORT=${HOST_PORT}
    env_file:
      - .env
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
