name: Reusable Deployment Notification Workflow

# Thin wrapper around .github/actions/notify-deployment, kept so the repos that
# already call this workflow keep working unchanged. New callers should use the
# composite action directly — as a step it reads the run's own context, so most
# of the inputs below stop being necessary:
#
#   - uses: kevit-io/grwt-api-node-deployment-notifications/.github/actions/notify-deployment@v1
#     with:
#       type: finish
#       status: success
#       environment: ${{ needs.parse-tag.outputs.env }}
#       thread_id: ${{ needs.notify-start.outputs.thread_id }}
#       api_url: ${{ secrets.DEPLOY_BOT_API_URL }}
#       team_id: ${{ secrets.DEVELOPERS_TEAMS_TEAM_ID }}
#       channel_id: ${{ secrets.DEVELOPERS_TEAMS_CHANNEL_ID }}

on:
  workflow_call:
    inputs:
      environment:
        description: "Deployment environment (development/staging/production)"
        required: true
        type: string
      notification_type:
        description: "Notification type: start, finish or alert"
        required: true
        type: string
        default: "start"

      # Optional — the action derives each of these from the workflow run when
      # it is left empty.
      repo_name:
        description: "Project repository name. Defaults to the calling repository."
        required: false
        type: string
        default: ""
      repo_link:
        description: "Project repository URL. Defaults to the calling repository's URL."
        required: false
        type: string
        default: ""
      trigger_by:
        description: "Who triggered the deployment. Defaults to the actor."
        required: false
        type: string
        default: ""
      trigger_title:
        description: "Trigger title. Defaults to the tag or the commit subject."
        required: false
        type: string
        default: ""
      trigger_link:
        description: "Link to trigger. Defaults to the release or commit page."
        required: false
        type: string
        default: ""
      action_link:
        description: "Link to the Actions run. Defaults to this run."
        required: false
        type: string
        default: ""
      start_time:
        description: >-
          Deployment start time (ISO-8601). Defaults to the time of the start
          notification, or to now minus duration_seconds for a result.
        required: false
        type: string
        default: ""

      # For finish / alert notifications
      thread_id:
        description: >-
          Thread ID from the start notification. When empty on a finish, the
          result is posted as a standalone alert rather than dropped.
        required: false
        type: string
        default: ""
      duration_seconds:
        description: "Deployment duration in seconds"
        required: false
        type: number
        default: 0
      status:
        description: "Deployment status (success/fail)"
        required: false
        type: string
        default: "success"
      error_message:
        description: "Error message if deployment failed"
        required: false
        type: string
        default: ""
      logs_link:
        description: "Link to deployment logs"
        required: false
        type: string
        default: ""
      email_ids:
        description: "Comma-separated email addresses for notifications"
        required: false
        type: string
        default: ""

    secrets:
      TEAMS_TEAM_ID:
        description: "Microsoft Teams Team ID"
        required: true
      TEAMS_CHANNEL_ID:
        description: "Microsoft Teams Channel ID"
        required: true
      API_URL:
        description: "Deployment notification API URL (also the OIDC audience)"
        required: true

    outputs:
      thread_id:
        description: "Thread ID from Teams notification (for start notifications)"
        value: ${{ jobs.notify.outputs.thread_id }}

# The OIDC token is minted in the CALLING repository's context: its
# `repository` and `repository_owner` claims are the caller's, not this repo's.
# The API allowlists on repository_owner, so a new org needs adding to
# ALLOWED_GITHUB_ORGS there before its deployments can notify.
permissions:
  id-token: write
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    outputs:
      thread_id: ${{ steps.notify.outputs.thread_id }}
    steps:
      - name: Send deployment notification
        id: notify
        uses: kevit-io/grwt-api-node-deployment-notifications/.github/actions/notify-deployment@v1
        with:
          api_url: ${{ secrets.API_URL }}
          team_id: ${{ secrets.TEAMS_TEAM_ID }}
          channel_id: ${{ secrets.TEAMS_CHANNEL_ID }}
          type: ${{ inputs.notification_type }}
          environment: ${{ inputs.environment }}
          status: ${{ inputs.status }}
          thread_id: ${{ inputs.thread_id }}
          duration_seconds: ${{ inputs.duration_seconds }}
          error_message: ${{ inputs.error_message }}
          logs_link: ${{ inputs.logs_link }}
          email_ids: ${{ inputs.email_ids }}
          repo_name: ${{ inputs.repo_name }}
          repo_link: ${{ inputs.repo_link }}
          trigger_by: ${{ inputs.trigger_by }}
          trigger_title: ${{ inputs.trigger_title }}
          trigger_link: ${{ inputs.trigger_link }}
          action_link: ${{ inputs.action_link }}
          start_time: ${{ inputs.start_time }}
          # A start notification that fails leaves nothing to thread a result
          # onto, so it is worth surfacing as a job failure. A finish or alert
          # must never take the deployment down with it.
          fail_on_error: ${{ inputs.notification_type == 'start' }}
